<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Séance Motio</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 24px; box-sizing: border-box;
    background: #F4F3EE; color: #23261C;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .carte { width: 100%; max-width: 420px; text-align: center; }
  .sur { font-size: 13px; letter-spacing: .18em; color: #6E7160; text-transform: uppercase; }
  h1 { font-size: 26px; margin: 10px 0 4px; }
  .infos { color: #6E7160; font-size: 14px; margin-bottom: 22px; }
  ul { list-style: none; padding: 0; margin: 0 0 22px; }
  li {
    background: #FFFFFF; border-radius: 10px; padding: 11px 14px; margin-bottom: 8px;
    display: flex; justify-content: space-between; gap: 12px; font-size: 15px; text-align: left;
  }
  li span { color: #4F6021; white-space: nowrap; font-weight: 700; }
  a.bouton {
    display: block; width: 100%; box-sizing: border-box; border: 0;
    background: #4F6021; color: #FFFFFF; font-weight: 700; font-size: 17px;
    padding: 15px; border-radius: 26px; text-decoration: none;
    font-family: inherit;
  }
</style>
</head>
<body>
<div class="carte">
  <div class="sur">Séance partagée</div>
  <h1 id="titre">Séance Motio</h1>
  <div class="infos" id="infos"></div>
  <ul id="liste"></ul>

  <a class="bouton" id="ouvrir" href="#">Ouvrir dans Motio</a>
</div>

<script>
// Ce qui suit le dièse est soit l'IDENTIFIANT COURT du lien (7 caractères,
// format actuel), soit le code complet de la séance (ancien format, encore
// dans tous les liens et QR codes déjà envoyés : il doit continuer de marcher).
const recu = decodeURIComponent(location.hash.replace(/^#/, "")).trim();

// Clé anon Supabase : publique par conception, elle est déjà compilée dans
// l'APK. C'est la Row Level Security qui protège les données, et cette table
// n'est atteignable que par la fonction resolve_share_link.
const SUPABASE_URL = "https://mwjfhavvoiafjueecopg.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im13amZoYXZ2b2lhZmp1ZWVjb3BnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3MjU1NTIsImV4cCI6MjEwMTMwMTU1Mn0.HESGew6nlDKjs3vRW73VGaKZqY5qpNX_xEq4tLWHoO4";

// Alphabet sans caractère ambigu, identique à share_link_id() en base.
const estIdCourt = (s) => /^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{7}$/i.test(s);

// Le bouton part sur ce qu'on a reçu : l'application sait résoudre les deux
// formes. Si la résolution aboutit ici, on le remplacera par le code complet,
// pour que l'import fonctionne même si le téléphone perd le réseau entre-temps.
document.getElementById("ouvrir").href = "chrono://seance?d=" + encodeURIComponent(recu);

/** Identifiant court → code complet de la séance, ou null. */
async function resoudre(id) {
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/resolve_share_link", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ p_id: id.toUpperCase() })
    });
    if (!r.ok) return null;
    const lignes = await r.json();
    return (lignes && lignes[0] && lignes[0].code) || null;
  } catch (e) { return null; }
}

// Aperçu de la séance : le code est du JSON compressé (deflate) puis encodé en
// base64 « URL ». Les navigateurs récents savent le décompresser tout seuls ;
// si ce n'est pas le cas, la page reste utilisable, seul l'aperçu manque.
(async () => {
  if (!recu) return;
  let code = recu;
  if (estIdCourt(recu)) {
    const long = await resoudre(recu);
    if (!long) {
      document.getElementById("infos").textContent =
        "Séance introuvable. Vérifie ta connexion, puis recharge la page.";
      return;
    }
    code = long;
    document.getElementById("ouvrir").href = "chrono://seance?d=" + code;
  }
  try {
    const b64 = code.replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(b64 + "=".repeat((4 - b64.length % 4) % 4));
    const octets = Uint8Array.from(bin, c => c.charCodeAt(0));
    const flux = new Blob([octets]).stream().pipeThrough(new DecompressionStream("deflate"));
    const json = await new Response(flux).json();

    if (json.n) document.getElementById("titre").textContent = json.n;
    const ex = json.e || [];
    document.getElementById("infos").textContent =
      (json.c || "") + " · " + ex.length + " exercice" + (ex.length > 1 ? "s" : "");
    const liste = document.getElementById("liste");
    ex.forEach(e => {
      const li = document.createElement("li");
      li.textContent = e.n || "Exercice";
      const d = document.createElement("span");
      d.textContent = e.tr ? (e.ps || 0) + " × " + e.tr + " reps" : (e.ps || 0) + " séries";
      li.appendChild(d);
      liste.appendChild(li);
    });
  } catch (e) { /* aperçu indisponible : le bouton d'ouverture suffit */ }
})();
</script>
</body>
</html>
