<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- interactive-widget=resizes-content : sans lui, le clavier virtuel ne
     rétrécit QUE le viewport visuel sur Android, pas le viewport de mise en
     page. Le `100dvh` de l'écran de discussion gardait donc la hauteur d'un
     écran SANS clavier : le navigateur faisait défiler pour montrer le champ
     de saisie, et tout le bas de la page restait posé derrière le clavier —
     d'où le grand vide entre la barre du bas et le clavier (signalé par
     Nicolas). Avec cette valeur, le clavier rétrécit aussi la mise en page,
     donc 100dvh suit et l'écran se pose juste au-dessus du clavier.
     Ignorée par les navigateurs qui ne la connaissent pas. -->
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Motio</title>
<meta name="theme-color" content="#171A11">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Motio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="appbar">
  <a class="wordmark" href="#/fil">
    <img class="wordmark-word" src="../assets/img/logo_motio_blanc.png" alt="Motio">
  </a>

  <div class="appbar-actions">
    <button id="btn-theme" class="icon-btn" type="button" aria-label="Thème">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M12 3a9 9 0 0 1 0 18"/></svg>
    </button>
    <button id="btn-bips" class="icon-btn" type="button" aria-label="Réglage du son">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M17 8.5a5 5 0 0 1 0 7"/></svg>
    </button>
    <button id="menu" class="menu-btn" aria-label="Plus d'options">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    </button>
  </div>
</header>

<div class="coque">
  <nav class="nav" aria-label="Navigation principale">
    <p class="nav-groupe">Social</p>
    <a href="#/fil">
      <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h9"/></svg>
      <span>Fil</span></a>
    <a href="#/amis">
      <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16.5 5.4a3.2 3.2 0 0 1 0 5.6M18 13.4a5.5 5.5 0 0 1 3 5.6"/></svg>
      <span>Amis</span></a>
    <a href="#/messages">
      <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v11H8l-4 3.5V6Z"/></svg>
      <span>Messages</span></a>
    <a href="#/defis">
      <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v4a6 6 0 0 1-12 0V3Z"/><path d="M6 5H3v2a4 4 0 0 0 3 3.9M18 5h3v2a4 4 0 0 1-3 3.9M9 21h6M12 15v6"/></svg>
      <span>Défis</span></a>
    <a href="#/groupes">
      <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M2.8 19a5.2 5.2 0 0 1 10.4 0M13.8 19a4.4 4.4 0 0 1 7.4-3.2"/></svg>
      <span>Groupes</span></a>
    <a href="#/profil">
      <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0"/></svg>
      <span>Mon profil</span></a>
    <a href="#/coach">
      <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 10.5c.3-1.6 3.4-1.6 3.7 0 .2 1.2-1.85 1.3-1.85 3M12 16.2v.1"/></svg>
      <span>Moti, ton coach</span></a>

    <p class="nav-groupe">Entraînement</p>
    <a href="#/minuteurs">
      <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8.5"/><path d="M12 9v4l2.5 1.5M10 1.5h4M17.5 4.5l1.3-1.3"/></svg>
      <span>Minuteurs</span></a>
    <a href="#/seances">
      <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></svg>
      <span>Séances</span></a>
    <a href="#/programmes">
      <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/></svg>
      <span>Programmes</span></a>
    <a href="#/historique">
      <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>Historique</span></a>

    <p class="nav-pied">Amis, Messages, Défis, Groupes, Programmes et Historique restent accessibles depuis ce menu.</p>
  </nav>

  <main id="vue" tabindex="-1"></main>
</div>

<!-- Barre du bas, comme dans l'application Android (Minuteurs/Entraînement/
     Social/Profil) : c'est la navigation principale sur mobile. Le menu ☰
     reste le chemin vers les sections secondaires (Amis, Messages, Groupes,
     Programmes, Historique). -->
<nav class="bottombar" aria-label="Navigation principale">
  <a href="#/minuteurs" data-groupe="minuteurs">
    <svg class="bb-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8.5"/><path d="M12 9v4l2.5 1.5M10 1.5h4M17.5 4.5l1.3-1.3"/></svg>
    <span>Minuteurs</span></a>
  <a href="#/seances" data-groupe="entrainement">
    <svg class="bb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></svg>
    <span>Entraînement</span></a>
  <a href="#/fil" data-groupe="social">
    <svg class="bb-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16.5 5.4a3.2 3.2 0 0 1 0 5.6M18 13.4a5.5 5.5 0 0 1 3 5.6"/></svg>
    <span>Social</span></a>
  <a href="#/profil" data-groupe="profil">
    <svg class="bb-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0"/></svg>
    <span>Profil</span></a>
</nav>

<!-- QR code (Kazuhiko Arase, MIT) : script classique, déjà vendorisé pour le
     site marketing (assets/js/vendor/qrcode.js) — expose window.qrcode. -->
<script src="../assets/js/vendor/qrcode.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
